name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  # Without this the link check first ran in the job that also deploys, so the
  # earliest a broken link could be caught was after it was already merged.
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should replace a pending one, but never interrupt a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned by digest, and verified before extraction. This job holds
      # pages:write and id-token:write, so anything that executes here can
      # deploy as us. Piping a download straight into tar would mean a swapped
      # release asset inherits those credentials. Verify first, extract second.
      #
      # A supply-chain auditor whose own docs pipeline does not check the hash
      # of its toolchain would be worth ignoring.
      - name: Install mdbook
        env:
          MDBOOK_VERSION: "0.4.40"
          MDBOOK_SHA256: "9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSLf --proto '=https' --tlsv1.2 \
            -o /tmp/mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  /tmp/mdbook.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mdbook.tar.gz --directory="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # mdbook turns a broken relative link into a 404 without a word, so a
      # rotted page looks fine until somebody clicks it.
      - name: Check links
        run: ./docs/check-links.py

      - name: Build
        run: mdbook build docs

      # A pull request builds the book and checks the links; it does not
      # publish. Only main reaches the live site.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request'
        with:
          path: docs/book

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
