name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.98.0, and rustup honours it, so there is
      # nothing to specify here. Pinning the version twice is one more place
      # for the two to disagree.
      - name: Toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      # The claim the whole entry rests on. If this ever stops being one line,
      # the build should fail before anything else runs.
      - name: The manifest is empty
        run: |
          set -euo pipefail
          test "$(cargo tree | wc -l)" -eq 1
          test "$(grep -c '^\[\[package\]\]' Cargo.lock)" -eq 1
          echo "one crate, one [[package]]"

      - name: No unsafe
        run: |
          set -euo pipefail
          # The attribute is what actually enforces this — the compiler rejects
          # any unsafe underneath it, so check the attribute is still there.
          grep -q '^#!\[forbid(unsafe_code)\]' src/lib.rs
          grep -q '^#!\[forbid(unsafe_code)\]' src/main.rs
          # The grep is belt and braces, and has to match the *syntax* rather
          # than the word. Matching the word fails on every comment explaining
          # why something avoids unsafe, which is how this check first broke.
          if grep -rnE '\bunsafe\s*(\{|fn\b|impl\b|trait\b|extern\b)' src/; then
            echo "unexpected unsafe" >&2
            exit 1
          fi
          echo "none, and forbidden at both crate roots"

      - name: No shelling out
        run: |
          set -euo pipefail
          if grep -rn 'Command::new' src/; then
            echo "stranger reads files; it does not run programs" >&2
            exit 1
          fi
          echo "none"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build offline
        run: CARGO_NET_OFFLINE=true cargo build --release --locked --offline

      # Every `$ stranger scan fixtures/...` in the book and the README is
      # followed by what the tool printed. Nothing kept those in step, and two
      # separate rots got through in one afternoon: the banded risk score
      # renumbered every published figure on one branch while four new format
      # pages were written against the old score on another, and the detection
      # rule's own examples stopped firing when packages gained an origin.
      # Needs the release binary, which is why it is here and not in docs.yml.
      - name: The docs still reproduce
        run: ./docs/check-output.py

      # Not `cargo test --include-ignored` — the ablation scans six fixtures
      # against a 140,000-name corpus ten times and takes about two minutes.
      # It runs here because the README quotes its numbers.
      - name: Ablation
        run: cargo test --release --test ablation -- --include-ignored

      - name: Reproducible build
        run: ./scripts/repro.sh
